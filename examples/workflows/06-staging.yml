name: Lab 06 local staging deployment
# A required deployment needs real evidence, including for docs-only revisions.
# Install only for Lab 6; merge_group does not support paths.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]
permissions: {}
cache-mode: none
jobs:
  local-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment: lab-staging
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts && npm run build
        working-directory: app
      - name: Deploy built bytes locally and check actual health
        env:
          LAB_STAGING_FAIL: ${{ vars.LAB_STAGING_FAIL || 'false' }}
        # TODO: Replace this placeholder with a temporary local deployment test.
        # Accept only true or false for LAB_STAGING_FAIL; true must deliberately
        # fail the deployment so you can observe the policy blocking the PR.
        # Otherwise start the already built app, check its health endpoint and
        # fail if it never becomes healthy. Limit how long the health check waits.
        # Always stop the server on success or failure. Do not rebuild or publish
        # to an external service. Lab 6 supplies the app command and endpoint.
        shell: bash
        run: |
          echo 'TODO: Validate LAB_STAGING_FAIL, start built bytes, bound health checks and always stop the server.' >&2
          exit 1
