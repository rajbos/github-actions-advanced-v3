name: Lab 05 stack and queue
# Required layer/queue evidence must not disappear behind trigger path filters.
# Install only for Lab 5; merge_group does not support paths.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]
permissions: {}
cache-mode: read
concurrency:
  group: lab-stack-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
        working-directory: app
      - run: npm test
        working-directory: app
  optional-top-layer:
    if: github.event_name == 'pull_request' && github.event.pull_request.stack != null && github.event.pull_request.stack.position == github.event.pull_request.stack.size
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo 'Optional top-layer report; never configure this as the required validation check.'
