name: Lab 05 stack and queue
# Required layer/queue evidence must not disappear behind trigger path filters.
# Install only for Lab 5; merge_group does not support paths.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]
permissions: {}
cache-mode: read
# TODO: Add a concurrency policy so a new commit to a PR cancels that same PR's
# older run, but does not cancel runs belonging to another PR or event type.
# Keep merge-group validation running; do not cancel it as if it were an old PR run.
# Use the bounded delay already supplied below to observe cancellation in Lab 5.
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Record tested revision and bounded cancellation fixture
        env:
          TESTED_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          DELAY_SECONDS: ${{ vars.LAB_STACK_DELAY_SECONDS || '0' }}
        run: |
          printf 'event=%s tested_sha=%s base_sha=%s\n' "$EVENT_NAME" "$TESTED_SHA" "$BASE_SHA"
          if [[ ! "$DELAY_SECONDS" =~ ^[0-9]+$ ]] || (( DELAY_SECONDS > 60 )); then
            echo "::error::LAB_STACK_DELAY_SECONDS must be an integer from 0 to 60"
            exit 1
          fi
          sleep "$DELAY_SECONDS"
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
        working-directory: app
      - run: npm test
        working-directory: app
  # TODO: Add an optional reporting job that runs only for the final PR in the
  # native stack (the second PR in this lab). Read the stack metadata described
  # in Lab 5 instead of hard-coding a PR number. It must not run for the first PR
  # or for a merge-group event, and it must not be configured as a required check.
