name: Lab 04 parallel checks
on:
  workflow_dispatch:
    inputs:
      fail-test:
        description: Fail the test branch after its tests pass (failure-propagation experiment)
        type: boolean
        default: false
permissions: {}
cache-mode: none
jobs:
  sequential:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
        working-directory: app
      - run: npm run lint
        working-directory: app
      - run: npm test
        working-directory: app
      - run: npm run build
        working-directory: app
  shared-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
        working-directory: app
      - name: Complete independent parallel checks
        # TODO: Replace this placeholder with a `parallel:` group on this runner.
        # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idstepsparallel
        # Run the app's lint command and test command at the same time.
        # Both must finish successfully before the existing build step can start.
        # In the test branch, run the real tests first. If the fail-test input is
        # true, then deliberately fail that branch so you can check that the
        # build is skipped. Do not hide the failure or install packages in parallel.
        # Keep the sequential job unchanged as the comparison. See Lab 4.
        run: |
          echo 'TODO: Run lint and tests concurrently, propagate fail-test and wait for both before building.' >&2
          exit 1
      - run: npm run build
        working-directory: app
  separate-runners:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
        working-directory: app
      - name: Complete isolated checks
        # TODO: Add a `strategy.matrix` to this job so lint and test each run in
        # their own job on a separate runner, then replace this placeholder with
        # one step that runs the check for the current matrix value.
        # https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/run-job-variations
        # The steps above already give each runner its own checkout, Node setup
        # and dependency installation. separate-build already waits for this job.
        # In the test job, run real tests, then deliberately fail when fail-test
        # is true. Compare setup overhead and total runner time with the other jobs.
        run: |
          echo 'TODO: Run lint and test on separate runners, including the fail-test experiment.' >&2
          exit 1
  separate-build:
    needs: separate-runners
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
        working-directory: app
      - run: npm run build
        working-directory: app
