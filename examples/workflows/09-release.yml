name: Lab 09 verified promotion
on:
  workflow_dispatch:
permissions: {}
cache-mode: none
env:
  GH_HOST: ${{ vars.LAB_GH_HOST || 'github.com' }}
concurrency:
  group: lab-release
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts && npm run lint && npm test && npm run build
        working-directory: app
      # TODO: Before packaging, generate an SPDX SBOM (software bill of materials)
      # for the npm components in app/dist, as practiced in Lab 8.
      # Save the JSON outside app/dist so the inventory does not include itself
      # and does not change the app files being packaged. Keep it for attestation.
      - run: tar -czf application.tgz -C app/dist .
      - id: digest
        run: |
          digest="$(sha256sum application.tgz | cut -d ' ' -f 1)"
          printf 'build_archive_sha256=%s\n' "$digest"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
      - name: Complete release evidence
        # TODO: Replace this placeholder with attestations for application.tgz.
        # Record both where/how it was built (provenance) and its staged-component
        # inventory (the SBOM created above). Both statements must identify this
        # archive, not a rebuilt copy or the artifact service's transport ZIP.
        # Add only the permissions the attestation action needs to the build job,
        # not the whole workflow. Lab 9 links the action inputs and permissions.
        run: |
          echo 'TODO: Attest provenance and the staged SBOM for this archive; grant only required build-job permissions.' >&2
          exit 1
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release
          # TODO: Expand the upload paths to include the SBOM JSON as well as
          # application.tgz, so the next job receives both pieces of evidence.
          path: application.tgz
          retention-days: 1
          if-no-files-found: error
  promote:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: lab-release
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release
      - name: Verify bytes and expected identity before executing anything
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_DIGEST: ${{ needs.build.outputs.digest }}
          EXPECTED_SHA: ${{ github.sha }}
        # TODO: Replace this placeholder with verification before any extraction.
        # Check that the downloaded archive's SHA-256 matches EXPECTED_DIGEST.
        # Verify both provenance and SBOM attestations, restricting their identity
        # to this repository, expected build workflow, main ref, EXPECTED_SHA
        # and a GitHub-hosted runner. An attestation is not enough if it belongs
        # to a different signer or file. Lab 9 links the verification flags.
        shell: bash
        run: |
          echo 'TODO: Compare archive digests and verify both predicates against expected repository/workflow/ref/commit and hosted runner.' >&2
          exit 1
      # TODO: After valid verification, add two tests that are expected to reject:
      # change bytes in a copy of the archive, and verify an unchanged
      # copy while requiring an intentionally wrong signer identity.
      # Keep the original archive untouched. Fail the job if either invalid test
      # is accepted. Inspect failures: a network or authentication error is not
      # evidence that the check rejected the file or signer.
      - name: Promote the verified archive to local staging
        # Supplied: extracts the verified archive without rebuilding, starts the
        # app, waits up to 20 seconds for /health and always stops the server.
        shell: bash
        run: |
          mkdir staged
          tar -xzf application.tgz -C staged
          node staged/src/server.js > "$RUNNER_TEMP/release-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3000/health > "$RUNNER_TEMP/health.json"; then
              node -e "const fs=require('fs'); const h=JSON.parse(fs.readFileSync(process.argv[1])); if(h.status!=='ok')process.exit(1)" "$RUNNER_TEMP/health.json"
              exit 0
            fi
            sleep 1
          done
          echo 'Promoted artifact failed its health check' >&2
          exit 1
